services:
  react:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - 5173:5173
    environment:
      VITE_API_BASE_URL: http://localhost/api
    volumes:
      - ./frontend:/app
      - react-node-modules:/app/node_modules
    networks:
      - backend

  nginx:
    image: nginx
    ports: 
      - 80:80
    networks: 
      - backend
    depends_on:
      - php-fpm
    volumes:
      - ./src/public:/var/www/html/public
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
  mysql:
    image: mysql
    ports: 
      - 3306:3306
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_ROOT_PASSWORD: password
    networks: 
      - backend
    volumes: 
      - mysql-data:/var/lib/mysql
  php-fpm:
    container_name: php-fpm
    build: 
      context: ./docker/laravel
      dockerfile: Dockerfile
    depends_on: 
      - mysql
    networks: 
      - backend
    volumes:
      - ./src:/var/www/html

volumes:
  mysql-data:
  react-node-modules:

networks:
  backend:
